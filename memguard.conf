# memguard configuration (copied to ~/.config/memguard/memguard.conf on first install).
# Edit ~/.config/memguard/memguard.conf, then run: memguard reload

# Fraction of RAM (or (100 - kern.memorystatus_level) / 100) at which the largest
# unprotected process (>= min_victim_gib) is SIGKILLed. Range: 0.10 to 1.00.
max_ram_fraction = 0.95

# Emergency RAM fraction at which the single largest soft-protected PID (>= min_victim_gib)
# is SIGKILLed if no unprotected process >= min_victim_gib exists. Range: 0.10 to 1.00.
panic_ram_fraction = 0.98

# RAM fraction at which the daemon switches from poll_interval_ms to fast_poll_interval_ms
# to catch fast allocation spikes before swap thrashing begins. Range: 0.10 to 1.00.
fast_poll_ram_fraction = 0.85

# Normal daemon poll interval in milliseconds when RAM is below fast_poll_ram_fraction.
poll_interval_ms = 1000

# High-pressure daemon poll interval in milliseconds when RAM >= fast_poll_ram_fraction.
fast_poll_interval_ms = 200

# Allowed swap growth in GiB above the downward-ratcheting swap baseline before killing
# the largest unprotected process. Set to 0.0 to trigger as soon as active swap growth starts.
max_swap_gib = 0.0

# Minimum single-tick swap burst in MiB required to trigger when max_swap_gib = 0.0 and
# system RAM usage is below 50% (ignores routine 8 MiB macOS background compressor aging).
swap_burst_floor_mib = 64

# Minimum process physical footprint (ri_phys_footprint) in GiB required before a process
# can be selected as a kill victim. Prevents killing small background tools.
min_victim_gib = 2.0

# Cooldown in seconds before re-targeting the same PID while the kernel reclaims its pages.
kill_cooldown_s = 15

# Protection tiers (case-insensitive exact match, or prefix* wildcard):
# - Prefix with '!' for HARD-PROTECTED OS, terminals, shells, editors & security daemons.
# - Plain name for SOFT-PROTECTED apps (spared on swap/95% RAM; single-PID fallback at 98%).
# Name checks are not atomic with signalling: protection reduces risk, not eliminates it.

# [HARD-PROTECTED] macOS core UI & system services
!WindowServer
!loginwindow
!Finder
!Dock
!SystemUIServer
!ControlCenter
!NotificationCenter
!Spotlight
!mds*
!corespotlightd

# [HARD-PROTECTED] Terminals, shells, multiplexers, editors & security/sync daemons
!herdr*
!tmux*
!zsh
!bash
!fish
!Terminal
!iTerm2*
!ghostty*
!WezTerm*
!Alacritty*
!kitty*
!sshd*
!ssh
!nvim
!vim
!KeePassXC*
!1Password*
!Bitwarden*
!Tailscale*
!tailscaled*

# [SOFT-PROTECTED] IDEs, browsers, research & communication apps
Code*
Zed*
Safari*
com.apple.WebKit*
Google Chrome*
Firefox*
plugin-container*
Arc*
zotero*
Slack*
Thunderbird*
WhatsApp*
